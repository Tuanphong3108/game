<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz 🧠</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('https://tuanphong3108.github.io/google-sans-do-not-access/minecraft.ttf') format('truetype');
            font-weight: normal; font-style: normal;
        }

        :root {
            --md-sys-color-primary: #006495;
            --md-sys-color-surface: #fdfcff;
        }

        body {
            font-family: 'Google Sans Flex', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: #1a1c1e;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
        }

        .md3-card {
            background: #ffffff;
            border-radius: 32px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Shape-shifting Engine */
        .shape-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 2px solid #e2e8f0;
            font-weight: bold;
            color: #1e40af;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 75px;
            height: 75px;
            border-radius: 40px; 
            transition: border-radius 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.2s ease,
                        transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: border-radius, width;
            transform: translateZ(0); 
            cursor: pointer;
            outline: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .shape-btn { width: 90px; height: 90px; border-radius: 45px; }
        }

        .pill-active {
            border-radius: 40px !important;
            width: 140px !important;
            background: #2563eb !important;
            color: white !important;
            transform: scale(0.95) translateZ(0) !important;
            border-color: #2563eb !important;
        }

        .loading-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            backdrop-blur: 15px; display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }

        /* Tinh chỉnh GIF Loading cho chính xác chiều ngang và màu sắc */
        .loading-gif {
            width: 200px; /* Căn chuẩn chiều ngang */
            height: auto;
            filter: grayscale(100%) brightness(0.5) contrast(1.2);
            mix-blend-multiply: multiply;
        }

        .feedback-pop {
            animation: feedbackIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes feedbackIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .stat-badge {
            @apply px-4 py-1.5 rounded-full text-xs font-bold mc-font shadow-sm;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Loading Overlay -->
    <div id="loading-overlay-container" class="loading-container">
        <div class="flex flex-col items-center">
            <img src="https://tuanphong3108.github.io/md3-loading/Loading_Indicator.gif" class="loading-gif mb-4" alt="Loading">
            <p class="text-xl font-bold text-blue-600 mc-font tracking-[0.3em] animate-pulse">REGENERATING</p>
        </div>
    </div>

    <!-- Header -->
    <header class="p-4 md:p-6 sticky top-0 bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex flex-col">
                <h1 class="text-xl md:text-2xl font-black tracking-tight text-blue-800">MATH <span class="text-blue-500">QUIZ</span></h1>
                <div class="flex gap-2 mt-1">
                    <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-bold mc-font">SCORE: <span id="score-header">0</span></span>
                </div>
            </div>
            
            <div class="flex items-center gap-3 bg-gray-100/50 p-1.5 rounded-full px-4 border border-gray-200">
                <div class="flex items-center gap-1">
                    <span class="material-symbols-outlined text-red-500 fill-1 text-xl">favorite</span>
                    <span id="lives-display" class="font-black text-lg mc-font">3</span>
                </div>
                <div class="h-4 w-[1px] bg-gray-300"></div>
                <div class="flex items-center gap-1 text-blue-600">
                    <span class="material-symbols-outlined text-xl">timer</span>
                    <span id="timer" class="font-black text-lg mc-font">15</span>
                </div>
            </div>

            <button onclick="showLoadingScreen()" class="p-2 hover:bg-gray-200 rounded-full transition-colors group">
                <span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500">refresh</span>
            </button>
        </div>
    </header>

    <main class="flex-grow p-4 flex flex-col items-center justify-center max-w-4xl mx-auto w-full">
        <div class="w-full mb-8 text-center">
            <div id="feedback-container" class="h-8 mb-2 flex items-center justify-center">
                <p id="feedback-message" class="font-bold text-lg"></p>
            </div>
            
            <div class="md3-card shadow-sm border border-gray-100 p-8 md:p-16 mb-6 bg-blue-50/20 relative overflow-hidden">
                <div id="progress-bar" class="absolute top-0 left-0 h-1 bg-blue-500/30 transition-all duration-1000" style="width: 0%"></div>
                <p id="question-mode-hint" class="text-[10px] uppercase tracking-widest font-bold text-blue-400 mb-4">KHỞI TẠO...</p>
                <h2 id="problem-text" class="text-5xl md:text-8xl font-bold mc-font text-gray-800 tracking-tighter">---</h2>
            </div>

            <div class="flex justify-center gap-4">
                <span class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-sm font-bold mc-font shadow-lg">LEVEL: <span id="level-display">1</span></span>
                <span class="bg-amber-500 text-white px-5 py-1.5 rounded-full text-sm font-bold mc-font shadow-lg">SCORE: <span id="score-display">0</span></span>
            </div>
        </div>

        <!-- Choice Mode Area -->
        <div id="options-container" class="flex justify-center gap-6 w-full h-[100px] items-center"></div>

        <!-- Numpad Mode Area -->
        <div id="input-mode-container" class="hidden w-full max-w-md">
            <div class="relative">
                <input type="text" id="answer-input" readonly
                    class="w-full text-center text-4xl font-bold py-6 bg-white border-2 border-blue-100 rounded-[32px] mb-8 mc-font text-blue-700 outline-none shadow-inner">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-[10px] px-3 py-1 rounded-full font-bold mc-font">INPUT ANSWER</div>
            </div>

            <div class="grid grid-cols-3 gap-y-4 gap-x-2 justify-items-center">
                <script>
                    for(let i=1; i<=9; i++) {
                        document.write(`<button onmousedown="animateBtn(this); appendDigit('${i}')" ontouchstart="animateBtn(this); appendDigit('${i}')" class="shape-btn mc-font text-2xl">${i}</button>`);
                    }
                </script>
                <button onmousedown="animateBtn(this); appendSign()" ontouchstart="animateBtn(this); appendSign()" class="shape-btn text-xl font-bold">+/-</button>
                <button onmousedown="animateBtn(this); appendDigit('0')" ontouchstart="animateBtn(this); appendDigit('0')" class="shape-btn mc-font text-2xl">0</button>
                <button onmousedown="animateBtn(this); deleteDigit()" ontouchstart="animateBtn(this); deleteDigit()" class="shape-btn text-red-500">
                    <span class="material-symbols-outlined text-3xl">backspace</span>
                </button>
            </div>
            <button onclick="submitAnswer()" class="w-full mt-8 bg-blue-600 text-white py-5 rounded-[28px] text-xl font-black mc-font shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3">
                <span class="material-symbols-outlined">task_alt</span>
                CHECK ANSWER
            </button>
        </div>
    </main>

    <!-- Defeated Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden items-center justify-center z-[200] p-4">
        <div class="md3-card w-full max-w-sm p-8 text-center flex flex-col items-center border border-white/10 shadow-2xl">
            <span class="material-symbols-outlined text-8xl text-red-500 mb-4 fill-1 animate-bounce">skull</span>
            <h3 class="text-4xl font-black mb-2 mc-font text-gray-800 tracking-tight">GAME OVER</h3>
            <div id="modal-message-container" class="mb-8 w-full"></div>
            <button onclick="showLoadingScreen()" class="w-full max-w-[240px] py-4 rounded-2xl bg-blue-600 text-white mc-font font-bold text-lg hover:rounded-[40px] transition-all duration-500 shadow-lg shadow-blue-200">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const correctSound = new Audio('https://tuanphong3108.github.io/game/minecraft_xp_sound.mp3');
        const wrongSound = new Audio('https://tuanphong3108.github.io/game/minecraft_oof.mp3');
        const operations = ['+', '-', '*', '/'];
        
        let correctResult = 0, score = 0, lives = 3, questionCount = 0;
        let isManualInputMode = false, timeLeft = 15, timerInterval = null, isGameOver = false;

        const el = {
            problem: document.getElementById('problem-text'),
            level: document.getElementById('level-display'),
            score: document.getElementById('score-display'),
            scoreHead: document.getElementById('score-header'),
            lives: document.getElementById('lives-display'),
            options: document.getElementById('options-container'),
            inputArea: document.getElementById('input-mode-container'),
            answerInput: document.getElementById('answer-input'),
            feedback: document.getElementById('feedback-message'),
            timer: document.getElementById('timer'),
            modeHint: document.getElementById('question-mode-hint'),
            modal: document.getElementById('alert-modal'),
            loading: document.getElementById('loading-overlay-container'),
            progress: document.getElementById('progress-bar')
        };

        window.animateBtn = (btn) => {
            btn.classList.add('pill-active');
            setTimeout(() => { btn.classList.remove('pill-active'); }, 400);
        };

        function showLoadingScreen() {
            el.loading.style.display = 'flex';
            setTimeout(() => location.reload(), 1200);
        }

        function updateUI() {
            el.level.textContent = questionCount;
            el.score.textContent = score;
            el.scoreHead.textContent = score;
            el.lives.textContent = lives;
            if(lives === 1) el.lives.parentElement.classList.add('animate-pulse', 'text-red-600');
        }

        function startTimer() {
            clearInterval(timerInterval);
            let totalTime = isManualInputMode ? 60 : 15; // Ưu tiên câu Manual Input 60 giây
            timeLeft = totalTime;
            el.timer.textContent = timeLeft;
            el.timer.className = "font-black text-lg mc-font";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                el.timer.textContent = timeLeft;
                
                // Progress bar logic
                const percent = (timeLeft / totalTime) * 100;
                el.progress.style.width = `${percent}%`;

                if(timeLeft <= 5) el.timer.classList.add('text-red-600', 'animate-bounce');
                if(timeLeft <= 0) { clearInterval(timerInterval); gameOver("HẾT GIỜ RỒI!"); }
            }, 1000);
        }

        function generateProblem() {
            if(isGameOver) return;
            questionCount++;
            // Logic cứ 3 câu thì có 1 câu Manual (Câu 3, 6, 9...)
            isManualInputMode = (questionCount % 3 === 0);
            
            let op = operations[Math.floor(Math.random() * operations.length)];
            let n1, n2;
            if(op === '+') { n1 = r(10, 99); n2 = r(10, 99); correctResult = n1 + n2; }
            else if(op === '-') { n1 = r(50, 150); n2 = r(10, 49); correctResult = n1 - n2; }
            else if(op === '*') { n1 = r(2, 12); n2 = r(2, 12); correctResult = n1 * n2; }
            else { n2 = r(2, 10); let q = r(2, 12); n1 = n2 * q; correctResult = q; }
            
            el.problem.textContent = `${n1} ${op === '/' ? '÷' : op === '*' ? '×' : op} ${n2}`;
            updateUI(); 
            renderMode(); 
            startTimer();
        }

        function renderMode() {
            if(isManualInputMode) {
                el.options.classList.add('hidden');
                el.inputArea.classList.remove('hidden');
                el.modeHint.textContent = "Manual Input (60s)";
                el.answerInput.value = "";
            } else {
                el.inputArea.classList.add('hidden');
                el.options.classList.remove('hidden');
                el.modeHint.textContent = "Quick Choice (15s)";
                
                let wrong = correctResult + (Math.random() > 0.5 ? r(1, 5) : r(-1, -5));
                let opts = [correctResult, wrong].sort(() => Math.random() - 0.5);
                
                el.options.innerHTML = '';
                opts.forEach(o => {
                    const b = document.createElement('button');
                    b.className = "shape-btn mc-font text-2xl";
                    b.textContent = o;
                    b.onmousedown = () => { animateBtn(b); check(o); };
                    b.ontouchstart = () => { animateBtn(b); check(o); };
                    el.options.appendChild(b);
                });
            }
        }

        function check(val) {
            if(isGameOver) return;
            clearInterval(timerInterval);
            if(parseInt(val) === correctResult) {
                score++; // Chỉ score tăng khi đúng
                correctSound.currentTime = 0; 
                correctSound.play();
                showFeedback("TUYỆT VỜI! +1 SCORE", "text-green-600");
                setTimeout(generateProblem, 700);
            } else {
                lives--; 
                wrongSound.currentTime = 0; 
                wrongSound.play();
                showFeedback("OOF! SAI MẤT RỒI", "text-red-600");
                if(lives <= 0) gameOver("BẠN ĐÃ CẠN KIỆT SINH LỰC");
                else setTimeout(generateProblem, 700);
            }
            updateUI();
        }

        function showFeedback(msg, color) {
            el.feedback.textContent = msg;
            el.feedback.className = `font-black text-xl mc-font feedback-pop ${color}`;
            setTimeout(() => el.feedback.textContent = "", 1000);
        }

        function gameOver(reason) {
            isGameOver = true; 
            clearInterval(timerInterval);
            el.modal.classList.remove('hidden'); 
            el.modal.classList.add('flex');
            document.getElementById('modal-message-container').innerHTML = `
                <p class="text-gray-400 mb-4 font-bold uppercase tracking-widest text-[10px]">${reason}</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-6 bg-blue-50/50 rounded-2xl border border-blue-100">
                        <p class="text-[10px] font-black text-blue-400 uppercase mb-1">Max Level</p>
                        <p class="text-4xl font-black mc-font text-blue-600">${questionCount}</p>
                    </div>
                    <div class="p-6 bg-amber-50/50 rounded-2xl border border-amber-100">
                        <p class="text-[10px] font-black text-amber-500 uppercase mb-1">Total Score</p>
                        <p class="text-4xl font-black mc-font text-amber-600">${score}</p>
                    </div>
                </div>
            `;
        }

        window.appendDigit = (d) => { if(el.answerInput.value.length < 5) el.answerInput.value += d; };
        window.deleteDigit = () => el.answerInput.value = el.answerInput.value.slice(0, -1);
        window.appendSign = () => {
            if(el.answerInput.value.startsWith('-')) el.answerInput.value = el.answerInput.value.substr(1);
            else if(el.answerInput.value !== "") el.answerInput.value = '-' + el.answerInput.value;
        };
        window.submitAnswer = () => { if(el.answerInput.value !== "") check(el.answerInput.value); }
        function r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        
        window.onload = generateProblem;
    </script>
</body>
</html>
