<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chosen One Game</title>
    <style>
        /* Setup Fullscreen và Nền Trắng */
        html, body {
            overflow: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: #f0f0f0; 
            font-family: 'Consolas', monospace;
            color: #333;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    
    <!-- Thẻ Audio cho nhạc nền (Ẩn, Loop) -->
    <audio id="gameMusic" loop>
        <source src="https://tuanphong3108.github.io/newtab/Wanted Music.m4a" type="audio/mp4">
        Your browser does-not support the audio element.
    </audio>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        // === FIREBASE IMPORTS (MANDATORY FOR PERSISTENCE) ===
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Bật debug log cho Firestore
        setLogLevel('Debug');
        
        let db;
        let auth;
        let userId = 'anon_user'; 
        let isFirebaseReady = false; 

        const HIGH_SCORE_COLLECTION = 'high_score_data';
        const HIGH_SCORE_DOC_ID = 'user_stats';

        // Lấy tham chiếu đến tài liệu High Score của người dùng hiện tại
        function getHighScoreDocRef() {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            // Lưu trữ dữ liệu riêng tư: /artifacts/{appId}/users/{userId}/{collection}/{document}
            return doc(db, 'artifacts', appId, 'users', userId, HIGH_SCORE_COLLECTION, HIGH_SCORE_DOC_ID);
        }

        // Hàm lưu High Score mới lên Firestore
        async function saveHighScore(newScore) {
             // Chỉ lưu nếu Firebase đã sẵn sàng và điểm mới cao hơn điểm cũ
             if (!isFirebaseReady || newScore <= highScore) return;

             try {
                 highScore = newScore; // Cập nhật ngay biến local
                 const docRef = getHighScoreDocRef();
                 await setDoc(docRef, { score: newScore });
                 console.log("Mốc kỷ lục mới đã được ghi nhận:", newScore);
             } catch (error) {
                 console.error("Lỗi khi lưu High Score:", error);
             }
        }

        // Lắng nghe High Score từ Firestore (Real-time)
        function listenForHighScore() {
            if (!isFirebaseReady) return;
            
            const docRef = getHighScoreDocRef();
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    highScore = data.score || 0;
                    console.log("High Score đã tải từ Firestore:", highScore);
                } else {
                    highScore = 0;
                    setDoc(docRef, { score: 0 }).catch(console.error);
                }
            }, (error) => {
                console.error("Lỗi khi lắng nghe High Score:", error);
            });
        }
        
        // Khởi tạo Firebase và xác thực
        async function setupFirebase() {
            try {
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                userId = auth.currentUser?.uid || crypto.randomUUID();

                isFirebaseReady = true;
                console.log("Hệ thống Firebase đã sẵn sàng. User ID:", userId);
                
                listenForHighScore();
                
                gameLoop(performance.now()); 

            } catch (error) {
                console.error("Lỗi: Không thể kết nối hoặc xác thực Firebase. High Score sẽ không được lưu.", error);
                isFirebaseReady = true; 
                gameLoop(performance.now());
            }
        }
        
        // =========================================================
        // === BẮT ĐẦU LOGIC GAME ===
        // =========================================================
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameMusic = document.getElementById('gameMusic');
        
        let GAME_WIDTH = window.innerWidth;
        let GAME_HEIGHT = window.innerHeight;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        let gameState = 'start'; 
        let score = 0;
        let highScore = 0; 
        
        // === BIẾN AUTO-PLAY VÀ TÂM MÀN HÌNH ===
        let isAutoPlay = false; 
        const DANGER_RADIUS = 200; // Bán kính nguy hiểm để AI bắt đầu né
        
        // HỆ SỐ TỐC ĐỘ DI CHUYỂN VỀ TÂM
        const WANDER_SPEED_FACTOR = 1.0; 
        // ĐỘ CHÍNH XÁC YÊU CẦU ĐỂ DỪNG LẠI Ở TÂM (user request: +/- 10)
        const CENTER_TOLERANCE = 10; 

        const FPS = 60;
        const frameInterval = 1000 / FPS;
        let lastTime = 0;

        // Tải hình ảnh The Chosen One
        const playerImage = new Image();
        playerImage.src = 'https://tuanphong3108.github.io/newtab/The_Chosen_One.png';
        let playerImageLoaded = false;

        // Tải hình ảnh Emoji Blue Sad
        const sadEmojiImage = new Image();
        sadEmojiImage.src = 'https://tuanphong3108.github.io/newtab/Blue_sad.png';
        let sadEmojiImageLoaded = false;
        const SAD_EMOJI_SIZE = 40; 

        // Tải hình ảnh Nền Game
        const backgroundImage = new Image();
        backgroundImage.src = 'https://cafefcdn.com/203337114487263232/2024/12/28/thanh-pho-thu-duc-15998341412921197373008-1735356701371-173535670166993653631.jpg';
        let backgroundImageLoaded = false;

        playerImage.onload = () => {
            playerImageLoaded = true;
            player.width = playerImage.width / 10; 
            player.height = playerImage.height / 10;
            
            player.x = GAME_WIDTH / 2;
            player.y = GAME_HEIGHT / 2;
        };
        playerImage.onerror = () => { console.error("Lỗi: Không tải được The Chosen One."); };

        sadEmojiImage.onload = () => { sadEmojiImageLoaded = true; };
        sadEmojiImage.onerror = () => { console.error("Lỗi: Không tải được Emoji."); };

        backgroundImage.onload = () => { backgroundImageLoaded = true; };
        backgroundImage.onerror = () => { console.error("Lỗi: Không tải được hình nền."); };

        // 2. Đối tượng Người chơi
        const player = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT / 2,
            width: 30, 
            height: 30, 
            speed: 6, 
            dx: 0,
            dy: 0,
            
            bobbingAmplitude: 2, 
            bobbingSpeed: 0.05,  
            tiltAmplitude: 0.05, 
            tiltSpeed: 0.03     
        };

        // 3. Đối tượng Đạn & Particles
        let bullets = [];
        let particles = []; 
        let playerThrustParticles = []; 
        
        let bulletSpeed = 3;
        let spawnRate = 40;
        let frameCount = 0;
        
        const PARTICLE_SIZE_FACTOR = 0.35; 
        const PARTICLE_LIFETIME = 60;
        const PARTICLE_COUNT = 5;

        // === Cấu hình particles lửa đẩy ===
        const THRUST_PARTICLE_SIZE = 5;
        const THRUST_PARTICLE_LIFETIME = 30; 
        const THRUST_PARTICLE_VELOCITY = 2; 
        const THRUST_PARTICLE_SPAWN_RATE = 2; 
        const THRUST_COLOR = '#ff4500'; 

        function createBullet() {
            let side = Math.floor(Math.random() * 4);
            let x, y, angle;
            const bulletSize = 15;
            const targetX = player.x + (player.dx * 15);
            const targetY = player.y + (player.dy * 15);
            
            switch (side) {
                case 0: x = Math.random() * GAME_WIDTH; y = -bulletSize; break;
                case 1: x = Math.random() * GAME_WIDTH; y = GAME_HEIGHT + bulletSize; break;
                case 2: x = -bulletSize; y = Math.random() * GAME_HEIGHT; break;
                case 3: x = GAME_WIDTH + bulletSize; y = Math.random() * GAME_HEIGHT; break;
            }
            
            angle = Math.atan2(targetY - y, targetX - x);

            bullets.push({
                x: x, y: y, size: bulletSize, color: '#00ffff', 
                vx: Math.cos(angle) * bulletSpeed,
                vy: Math.sin(angle) * bulletSpeed,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function createParticles(bullet) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: bullet.x, y: bullet.y, size: bullet.size * PARTICLE_SIZE_FACTOR, color: bullet.color,
                    vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                    lifetime: PARTICLE_LIFETIME, 
                    maxLifetime: PARTICLE_LIFETIME, 
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function createPlayerThrustParticle() {
            const startX = player.x + (Math.random() - 0.5) * player.width * 0.3; 
            const startY = player.y + player.height / 2; 

            const angle = Math.PI / 2 + (Math.random() - 0.5) * 0.8; 
            const vx = Math.cos(angle) * THRUST_PARTICLE_VELOCITY * (Math.random() * 0.5 + 0.5); 
            const vy = Math.sin(angle) * THRUST_PARTICLE_VELOCITY * (Math.random() * 0.5 + 0.5); 

            playerThrustParticles.push({
                x: startX, y: startY, size: THRUST_PARTICLE_SIZE, color: THRUST_COLOR,
                vx: vx, vy: vy,
                lifetime: THRUST_PARTICLE_LIFETIME,
                maxLifetime: THRUST_PARTICLE_LIFETIME, 
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.3
            });
        }
        
        // 4. Input Handling (WASD)
        let keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }
            if (gameState === 'gameOver' && e.code === 'Space') {
                e.preventDefault();
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas.addEventListener('click', (e) => {
            if (gameState === 'start') {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // Cấu hình vị trí
                const startButtonWidth = 200;
                const startButtonHeight = 60;
                const toggleButtonWidth = 200;
                const toggleButtonHeight = 50;

                // Vị trí Toggle
                const toggleX = GAME_WIDTH / 2 - toggleButtonWidth / 2;
                const toggleY = GAME_HEIGHT / 2 + 50 - toggleButtonHeight / 2; 

                // Vị trí START MISSION 
                const startX = GAME_WIDTH / 2 - startButtonWidth / 2;
                const startY = GAME_HEIGHT / 2 + 120 - startButtonHeight / 2;
                
                // 1. Logic cho nút START MISSION
                if (mouseX >= startX && mouseX <= startX + startButtonWidth &&
                    mouseY >= startY && mouseY <= startY + startButtonHeight) {
                    
                    startGame();
                    return;
                }
                
                // 2. Logic cho nút AUTO-PLAY
                if (mouseX >= toggleX && mouseX <= toggleX + toggleButtonWidth &&
                    mouseY >= toggleY && mouseY <= toggleY + toggleButtonHeight) {
                    
                    isAutoPlay = !isAutoPlay;
                    return;
                }
            }
        });

        // === HÀM TỰ ĐỘNG LÁI (AI) VỚI LOGIC DI CHUYỂN VỀ TÂM ===
        function autoPilot() {
            let closestBullet = null;
            let minDistanceSq = DANGER_RADIUS * DANGER_RADIUS;

            // 1. Tìm viên đạn gần nhất trong bán kính nguy hiểm
            bullets.forEach(bullet => {
                const dx = player.x - bullet.x;
                const dy = player.y - bullet.y;
                const distSq = dx * dx + dy * dy;

                if (distSq < minDistanceSq) {
                    minDistanceSq = distSq;
                    closestBullet = bullet;
                }
            });

            player.dx = 0;
            player.dy = 0;

            if (closestBullet) {
                // 1. CHẾ ĐỘ NÉ (DODGE MODE) - Sử dụng tốc độ tối đa
                const angle = Math.atan2(player.y - closestBullet.y, player.x - closestBullet.x);
                
                player.dx = Math.cos(angle) * player.speed;
                player.dy = Math.sin(angle) * player.speed;
            } else {
                // 2. CHẾ ĐỘ TÁI ĐỊNH VỊ VỀ TRUNG TÂM (CENTER REPOSITION MODE)
                
                const centerX = GAME_WIDTH / 2;
                const centerY = GAME_HEIGHT / 2;
                
                // Kiểm tra xem đã nằm trong khu vực +/- 10px so với tâm chưa
                const isNearCenterX = Math.abs(player.x - centerX) < CENTER_TOLERANCE;
                const isNearCenterY = Math.abs(player.y - centerY) < CENTER_TOLERANCE;
                
                if (isNearCenterX && isNearCenterY) {
                    // Đã ở giữa, dừng lại để giữ vị trí tuyệt đối
                    player.dx = 0;
                    player.dy = 0;
                } else {
                    // Chưa ở giữa, di chuyển nhanh về tâm
                    const dxToCenter = centerX - player.x;
                    const dyToCenter = centerY - player.y;
                    const angleToCenter = Math.atan2(dyToCenter, dxToCenter);
                    
                    const wanderSpeed = player.speed * WANDER_SPEED_FACTOR; // Tốc độ 100%

                    player.dx = Math.cos(angleToCenter) * wanderSpeed;
                    player.dy = Math.sin(angleToCenter) * wanderSpeed;
                }
            }
            
            // Cập nhật vị trí của player
            player.x += player.dx;
            player.y += player.dy;

            // Giới hạn trong màn hình (đảm bảo nó không bao giờ vượt ra khỏi biên)
            player.x = Math.max(player.width / 2, Math.min(player.x, GAME_WIDTH - player.width / 2));
            player.y = Math.max(player.height / 2, Math.min(player.y, GAME_HEIGHT - player.height / 2));
        }

        function manualControl() {
            player.dx = 0;
            player.dy = 0;

            if (keys['KeyW']) { player.dy = -player.speed; }
            if (keys['KeyS']) { player.dy = player.speed; }
            if (keys['KeyA']) { player.dx = -player.speed; }
            if (keys['KeyD']) { player.dx = player.speed; } 

            if (player.dx !== 0 && player.dy !== 0) {
                const factor = player.speed / Math.sqrt(player.dx * player.dx + player.dy * player.dy);
                player.dx *= factor;
                player.dy *= factor;
            }

            player.x += player.dx;
            player.y += player.dy;

            player.x = Math.max(player.width / 2, Math.min(player.x, GAME_WIDTH - player.width / 2));
            player.y = Math.max(player.height / 2, Math.min(player.y, GAME_HEIGHT - player.height / 2));
        }

        function updatePlayerMovement() {
            if (isAutoPlay) {
                autoPilot();
            } else {
                manualControl();
            }
        }

        // 5. Hàm vẽ (DRAWING FUNCTIONS)
        
        function drawBackground() {
            if (backgroundImageLoaded) {
                ctx.drawImage(backgroundImage, 0, 0, GAME_WIDTH, GAME_HEIGHT);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            }
        }

        function drawPlayer() {
            if (playerImageLoaded) {
                
                const bobOffset = player.bobbingAmplitude * Math.sin(frameCount * player.bobbingSpeed);
                const tiltAngle = player.tiltAmplitude * Math.sin(frameCount * player.tiltSpeed);

                ctx.save();
                ctx.translate(player.x, player.y + bobOffset);
                ctx.rotate(tiltAngle);

                // Highlight Chosen One khi ở chế độ Auto-play
                if (isAutoPlay) {
                    ctx.shadowColor = '#ff00ff';
                    ctx.shadowBlur = 20;
                }

                ctx.drawImage(playerImage, 
                              -player.width / 2, 
                              -player.height / 2, 
                              player.width, player.height);

                ctx.restore();
                ctx.shadowBlur = 0; // Tắt shadow sau khi vẽ xong
            } else {
                ctx.fillStyle = isAutoPlay ? '#ff00ff' : '#000000';
                ctx.fillRect(player.x - player.width / 2, player.y - player.height / 2, player.width, player.height);
            }
        }

        function drawBullet(bullet) {
            ctx.save();
            ctx.translate(bullet.x, bullet.y);
            bullet.rotation += bullet.rotationSpeed;
            ctx.rotate(bullet.rotation);
            ctx.fillStyle = bullet.color;
            ctx.fillRect(-bullet.size / 2, -bullet.size / 2, bullet.size, bullet.size);
            ctx.restore();
        }

        function drawParticle(particle) { 
            ctx.save();
            
            ctx.fillStyle = particle.color;
            ctx.globalAlpha = particle.lifetime / particle.maxLifetime; 
            
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, particle.size / 2, 0, Math.PI * 2); 
            ctx.fill();
            
            ctx.restore();
            ctx.globalAlpha = 1;
        }
        
        function drawStartScreen() {
            drawBackground(); 

            ctx.fillStyle = '#fff'; 
            ctx.font = 'bold 80px "Inter", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('THE CHOSEN ONE', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 120);

            if (playerImageLoaded) {
                const bobOffset = player.bobbingAmplitude * Math.sin(frameCount * player.bobbingSpeed * 0.5); 
                const tiltAngle = player.tiltAmplitude * Math.sin(frameCount * player.tiltSpeed * 0.5);

                const imgWidth = player.width * 2; 
                const imgHeight = player.height * 2;
                
                ctx.save();
                ctx.translate(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 60 + bobOffset);
                ctx.rotate(tiltAngle);
                
                ctx.drawImage(playerImage, 
                              -imgWidth / 2, 
                              -imgHeight / 2, 
                              imgWidth, imgHeight);

                ctx.restore();
            }

            // Cấu hình vị trí
            const startButtonWidth = 200;
            const startButtonHeight = 60;
            const toggleButtonWidth = 200;
            const toggleButtonHeight = 50;
            
            // --- CÔNG TẮC AUTO-PLAY (Đã di chuyển lên trên) ---
            const toggleX = GAME_WIDTH / 2 - toggleButtonWidth / 2;
            const toggleY = GAME_HEIGHT / 2 + 50 - toggleButtonHeight / 2; 

            // Nền & Shadow
            ctx.fillStyle = isAutoPlay ? '#ff00ff' : '#aaaaaa'; 
            ctx.shadowColor = isAutoPlay ? '#ff00ff' : '#555555';
            ctx.shadowBlur = isAutoPlay ? 15 : 8; 
            ctx.fillRect(toggleX, toggleY, toggleButtonWidth, toggleButtonHeight);
            ctx.shadowBlur = 0; 
            
            // Viền nổi bật
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeRect(toggleX, toggleY, toggleButtonWidth, toggleButtonHeight);

            // Chữ
            ctx.fillStyle = '#000000'; 
            ctx.font = 'bold 22px "Inter", sans-serif'; 
            // CẬP NHẬT TÊN CHẾ ĐỘ (TỐI GIẢN HÓA)
            ctx.fillText(`AUTO-PLAY: ${isAutoPlay ? 'ON (AI TỰ ĐỘNG CHƠI)' : 'OFF (WASD ĐỂ CHƠI)'}`, GAME_WIDTH / 2, toggleY + 30);
            
            
            // --- NÚT START MISSION (Đã di chuyển xuống dưới Toggle) ---
            const startX = GAME_WIDTH / 2 - startButtonWidth / 2;
            const startY = GAME_HEIGHT / 2 + 120 - startButtonHeight / 2;

            ctx.fillStyle = '#00ffff'; 
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.fillRect(startX, startY, startButtonWidth, startButtonHeight);
            ctx.shadowBlur = 0; 

            ctx.fillStyle = '#000000'; 
            ctx.font = 'bold 24px "Inter", sans-serif';
            ctx.fillText('START MISSION', GAME_WIDTH / 2, startY + 8 + startButtonHeight / 2);

            
            // --- HIỂN THỊ HIGH SCORE ĐÃ TẢI ---
            ctx.fillStyle = '#ffcc00'; 
            ctx.font = 'bold 30px "Inter", sans-serif';
            ctx.fillText(`Kỷ lục hiện tại: ${highScore}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 200);
            
            ctx.fillStyle = '#fff'; 
            ctx.font = '20px Consolas, monospace';
            ctx.fillText('Sử dụng WASD để điều khiển', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 300); 
        }
        
        function drawScoreAndStatus() {
            // Chữ trắng để nổi bật trên nền ảnh tối
            ctx.fillStyle = '#ffffff'; 
            ctx.font = 'bold 28px Consolas, monospace';
            
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 30, 40);

            ctx.textAlign = 'right';
            ctx.fillText(`HIGH SCORE: ${highScore}`, GAME_WIDTH - 30, 40);

            // Hiển thị trạng thái AI khi đang chạy (ĐÃ BỎ CHỮ THỪA)
            if (isAutoPlay && gameState === 'running') {
                ctx.fillStyle = '#ff00ff';
                ctx.font = 'bold 18px Consolas, monospace';
                ctx.textAlign = 'center';
                ctx.fillText('AI PILOT ACTIVE', GAME_WIDTH / 2, 40);
            }
            
            if (gameState === 'gameOver') {
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 72px "Inter", sans-serif';
                ctx.textAlign = 'center';

                const missionFailedText = 'MISSION FAILED!';
                const textX = GAME_WIDTH / 2;
                const textY = GAME_HEIGHT / 2 - 50;
                
                ctx.fillText(missionFailedText, textX, textY);
                
                if (sadEmojiImageLoaded) {
                    ctx.save();
                    ctx.font = 'bold 72px "Inter", sans-serif'; 
                    const textMetrics = ctx.measureText(missionFailedText);
                    const textWidth = textMetrics.width;
                    
                    const emojiX = textX + textWidth / 2 + 10; 
                    const emojiY = textY - SAD_EMOJI_SIZE * 0.7; 
                    
                    ctx.drawImage(sadEmojiImage, emojiX, emojiY, SAD_EMOJI_SIZE, SAD_EMOJI_SIZE);
                    ctx.restore();
                }
                
                ctx.font = 'bold 36px "Inter", sans-serif';
                ctx.fillText(`Điểm của bạn: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 10);

                ctx.font = '24px "Inter", sans-serif';
                ctx.fillText('Nhấn SPACE để TÁI KHỞI ĐỘNG...', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 70);
            }
        }


        // 6. Logic Game chính
        
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.rotation += bullet.rotationSpeed;

                const playerLeft = player.x - player.width / 2;
                const playerRight = player.x + player.width / 2;
                const playerTop = player.y - player.height / 2;
                const playerBottom = player.y + player.height / 2;

                const bulletLeft = bullet.x - bullet.size / 2;
                const bulletRight = bullet.x + bullet.size / 2;
                const bulletTop = bullet.y - bullet.size / 2;
                const bulletBottom = bullet.y + bullet.size / 2;

                if (playerLeft < bulletRight && playerRight > bulletLeft &&
                    playerTop < bulletBottom && playerBottom > bulletTop) {
                    
                    gameState = 'gameOver';
                    gameMusic.pause(); 
                    
                    if (score > highScore) {
                        saveHighScore(score); 
                    }
                    return; 
                }

                if (bullet.x < -bullet.size * 2 || bullet.x > GAME_WIDTH + bullet.size * 2 || 
                    bullet.y < -bullet.size * 2 || bullet.y > GAME_HEIGHT + bullet.size * 2) {
                    
                    createParticles(bullet);
                    bullets.splice(i, 1);
                }
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                p.lifetime--;

                if (p.lifetime <= 0) {
                    particles.splice(i, 1);
                }
            }

            for (let i = playerThrustParticles.length - 1; i >= 0; i--) {
                let p = playerThrustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                p.lifetime--;

                if (p.lifetime <= 0) {
                    playerThrustParticles.splice(i, 1);
                }
            }
        }
        
        function handleBulletSpawning() {
            // Tần suất spawn
            const spawnInterval = spawnRate; 

            if (frameCount % spawnInterval === 0) {
                createBullet();
            }
            
            // Tăng độ khó mỗi 5 giây
            if (frameCount % (FPS * 5) === 0) {
                 if (spawnRate > 10) spawnRate -= 2; 
                 bulletSpeed += 0.2; 
                 player.speed += 0.1;
            }
        }

        function handlePlayerThrust() {
            if (frameCount % THRUST_PARTICLE_SPAWN_RATE === 0) {
                createPlayerThrustParticle();
            }
        }

        function startGame() {
            gameState = 'running';
            gameMusic.currentTime = 0; 
            gameMusic.play().catch(e => console.error("Lỗi phát nhạc:", e)); 
        }
        
        function resetGame() {
            player.x = GAME_WIDTH / 2;
            player.y = GAME_HEIGHT / 2;
            bullets = [];
            particles = [];
            playerThrustParticles = []; 
            score = 0;
            bulletSpeed = 3;
            spawnRate = 40;
            player.speed = 6;
            frameCount = 0;
            keys = {}; 
            gameState = 'running'; 
            gameMusic.currentTime = 0;
            gameMusic.play().catch(e => console.error("Lỗi phát nhạc:", e));
            lastTime = performance.now(); 
        }
        
        function gameLoop(currentTime) {
            
            if (!isFirebaseReady) {
                 requestAnimationFrame(gameLoop);
                 return;
            }

            const deltaTime = currentTime - lastTime;
            
            if (deltaTime >= frameInterval) {
                lastTime = currentTime - (deltaTime % frameInterval);

                drawBackground(); 

                if (gameState === 'start') {
                    drawStartScreen();
                    frameCount++; 
                } else if (gameState === 'running') {
                    updatePlayerMovement();
                    updateBullets();
                    updateParticles();
                    handleBulletSpawning();
                    handlePlayerThrust(); 
                    
                    frameCount++;
                    score = Math.floor(frameCount / FPS); 
                } else if (gameState === 'gameOver') {
                    updateParticles(); 
                    drawScoreAndStatus();
                }
                
                if (gameState !== 'start') {
                    particles.forEach(p => drawParticle(p)); 
                    playerThrustParticles.forEach(p => drawParticle(p)); 
                    bullets.forEach(drawBullet);
                    drawPlayer();
                    drawScoreAndStatus(); 
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Khởi động Firebase và sau đó khởi động game loop
        window.onload = () => {
            setupFirebase();
        };
        
    </script>
</body>
</html>
